  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    // =========================================================================
    // 1. REACT ERROR BOUNDARY (PREVENTS BLANK SCREENS)
    // =========================================================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || 'Unexpected render error' };
      }
      componentDidCatch(error, info) {
        console.error('SmartBulk ErrorBoundary:', error, info);
      }
      handleHardReset = () => {
        try {
          localStorage.removeItem('smartbulk_v3_state');
        } catch (e) {}
        window.location.reload();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#070b14] text-slate-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/40 flex items-center justify-center text-rose-400 mb-4 font-extrabold text-xl">
                !
              </div>
              <h1 className="text-lg font-extrabold text-white">Something went wrong</h1>
              <p className="text-xs text-slate-400 mt-1.5 max-w-xs leading-relaxed">
                {this.state.errorMessage}
              </p>
              <button
                onClick={this.handleHardReset}
                className="mt-5 px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs hover:bg-emerald-400 transition"
              >
                Reset State & Reload App
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    // 3. DATE HELPERS & PERSISTENCE ('smartbulk_v3_state')
    // =========================================================================
    const STORAGE_KEY = 'smartbulk_v3_state';
    const BASELINE_CALORIES = 2800; // Anchor at 60.0 kg -> 1.00x portions
    const MS_PER_DAY = 24 * 60 * 60 * 1000;

    function getTodayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseLocalMidnight(isoStr) {
      const [y, m, d] = (isoStr || getTodayISO()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1).getTime();
    }

    function addDaysISO(isoStr, days) {
      const [y, m, d] = (isoStr || getTodayISO()).split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, (d || 1) + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function getMondayOfWeekISO(anchorISO) {
      const [y, m, d] = (anchorISO || getTodayISO()).split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, d || 1);
      const day = dt.getDay(); // 0=Sun..6=Sat
      const diff = day === 0 ? -6 : 1 - day;
      dt.setDate(dt.getDate() + diff);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function formatShortDate(isoStr) {
      const [y, m, d] = (isoStr || getTodayISO()).split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, d || 1);
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatCompactDate(isoStr) {
      const [y, m, d] = (isoStr || getTodayISO()).split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, d || 1);
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatOffsetTime(baseHHMM, offsetMinutes) {
      const [hStr, mStr] = (baseHHMM || '06:00').split(':');
      let total = (parseInt(hStr, 10) || 6) * 60 + (parseInt(mStr, 10) || 0) + offsetMinutes;
      total = ((total % 1440) + 1440) % 1440;
      const hrs = Math.floor(total / 60);
      const mins = total % 60;
      const period = hrs >= 12 ? 'PM' : 'AM';
      const displayH = hrs % 12 === 0 ? 12 : hrs % 12;
      return `${displayH}:${String(mins).padStart(2, '0')} ${period}`;
    }

    function getCurrentWeekDates() {
      const mondayISO = getMondayOfWeekISO(getTodayISO());
      const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      return labels.map((label, idx) => {
        const iso = addDaysISO(mondayISO, idx);
        return {
          dayIdx: idx,
          label,
          iso,
          compactDate: formatCompactDate(iso),
          isToday: iso === getTodayISO()
        };
      });
    }

    function createDefaultState() {
      const todayISO = getTodayISO();
      const endISO = addDaysISO(todayISO, 112); // Default 16 weeks / 112 days
      return {
        activeTab: 'diet',
        theme: 'dark',
        dietMode: 'nonveg', // 'nonveg' | 'veg'
        selectedDietDate: todayISO,
        timeline: {
          startDate: todayISO,
          endDate: endISO,
          startWeight: 60.0,
          targetGain: 12.0,
          workoutTime: '06:00'
        },
        checkedMealsByDate: {},
        selectedWorkoutDay: 1,
        completedSets: {},
        completedWorkoutDays: {},
        checkedGroceries: {},
        customGroceries: [],
        collapsedCategories: {},
        weightLogs: [
          {
            id: 'w_start',
            date: todayISO,
            weight: 60.0,
            note: 'Day 1 Starting Baseline'
          }
        ]
      };
    }

    function loadInitialState() {
      const defaults = createDefaultState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults;
        const parsed = JSON.parse(raw);
        const weekDates = getCurrentWeekDates().map(d => d.iso);
        const validDietDate = weekDates.includes(parsed.selectedDietDate)
          ? parsed.selectedDietDate
          : getTodayISO();
        return {
          ...defaults,
          ...parsed,
          selectedDietDate: validDietDate,
          timeline: { ...defaults.timeline, ...(parsed.timeline || {}) },
          checkedMealsByDate: parsed.checkedMealsByDate || {},
          weightLogs: Array.isArray(parsed.weightLogs) && parsed.weightLogs.length > 0
            ? parsed.weightLogs
            : defaults.weightLogs
        };
      } catch (e) {
        return defaults;
      }
    }

    // =========================================================================
    // 4. ADAPTIVE ENGINE: TIMELINE, CALORIES, MEALS, WORKOUTS & GROCERIES
    // =========================================================================
    function computeTimelineMetrics(state) {
      const tl = state.timeline;
      const startMs = parseLocalMidnight(tl.startDate);
      const endMs = Math.max(startMs + 7 * MS_PER_DAY, parseLocalMidnight(tl.endDate));
      const todayMs = parseLocalMidnight(getTodayISO());

      const totalDays = Math.max(7, Math.round((endMs - startMs) / MS_PER_DAY));
      const rawElapsed = Math.round((todayMs - startMs) / MS_PER_DAY);
      const daysElapsed = Math.max(0, Math.min(totalDays, rawElapsed));
      const daysRemaining = Math.max(0, totalDays - daysElapsed);
      const currentDayNumber = Math.min(totalDays, daysElapsed + 1);
      const currentWeekNumber = Math.max(1, Math.ceil(currentDayNumber / 7));
      const timelinePct = Math.round((daysElapsed / totalDays) * 100);

      const startWeight = Number(tl.startWeight) || 60.0;
      const targetGain = Number(tl.targetGain) || 12.0;
      const targetWeight = +(startWeight + targetGain).toFixed(1);
      const weeklyRateKg = +(targetGain / (totalDays / 7)).toFixed(2);

      // Linear interpolation for Expected Weight Today
      const expectedWeightToday = +(startWeight + (targetGain * daysElapsed) / totalDays).toFixed(1);

      // Sort weight logs chronologically
      const sortedLogs = [...state.weightLogs].sort((a, b) => a.date.localeCompare(b.date));
      const latestLog = sortedLogs[sortedLogs.length - 1] || { weight: startWeight, date: tl.startDate };
      const currentWeight = Number(latestLog.weight) || startWeight;

      const actualGainSoFar = +(currentWeight - startWeight).toFixed(1);
      const varianceKg = +(currentWeight - expectedWeightToday).toFixed(1);
      const weightGainPct = Math.max(0, Math.min(100, Math.round((actualGainSoFar / Math.max(0.5, targetGain)) * 100)));

      let paceStatus = 'On Pace';
      let paceTone = 'sky';
      if (varianceKg >= 0.25) {
        paceStatus = 'Ahead of Pace';
        paceTone = 'emerald';
      } else if (varianceKg <= -0.25) {
        paceStatus = 'Behind Pace';
        paceTone = 'amber';
      }

      // Maintenance & Adaptive Calorie Surplus Engine:
      // 1) Base maintenance scales with current body weight (~37.5 kcal/kg for active 6-day lifter)
      // 2) Required daily surplus based on weekly target gain rate (~1100 kcal per kg/week)
      // 3) Automatic weight-gain scaling (+150 kcal every +3 kg gained above startWeight)
      // 4) Automatic catch-up boost (+150 kcal/day if behind expected weight by > 0.5 kg)
      const maintenanceCalories = Math.round((currentWeight * 37.5) / 25) * 25;
      const baseSurplus = Math.min(750, Math.max(400, Math.round((weeklyRateKg * 1100) / 25) * 25));
      const milestoneStepBoost = Math.max(0, Math.floor(actualGainSoFar / 3)) * 150;
      const behindPaceBoost = varianceKg < -0.5 ? 150 : 0;

      const targetCalories = Math.round((maintenanceCalories + baseSurplus + milestoneStepBoost + behindPaceBoost) / 25) * 25;
      const targetProtein = Math.round(currentWeight * 1.95); // ~1.95g/kg
      const targetFats = Math.round((targetCalories * 0.27) / 9);
      const targetCarbs = Math.max(150, Math.round((targetCalories - targetProtein * 4 - targetFats * 9) / 4));
      const portionScale = +(targetCalories / BASELINE_CALORIES).toFixed(2);

      // Phase classification for progressive workouts
      let phaseName = 'Phase 1: Hypertrophy Foundation';
      let phaseShort = 'Phase 1 (Wks 1–4)';
      let phaseNumber = 1;
      if (currentWeekNumber >= 11) {
        phaseName = 'Phase 3: Peak Overload & Density';
        phaseShort = 'Phase 3 (Wks 11+)';
        phaseNumber = 3;
      } else if (currentWeekNumber >= 5) {
        phaseName = 'Phase 2: Progressive Volume';
        phaseShort = 'Phase 2 (Wks 5–10)';
        phaseNumber = 2;
      }

      return {
        startDate: tl.startDate,
        endDate: tl.endDate,
        workoutTime: tl.workoutTime || '06:00',
        totalDays,
        daysElapsed,
        daysRemaining,
        currentDayNumber,
        currentWeekNumber,
        timelinePct,
        startWeight,
        targetGain,
        targetWeight,
        weeklyRateKg,
        expectedWeightToday,
        currentWeight,
        actualGainSoFar,
        varianceKg,
        weightGainPct,
        paceStatus,
        paceTone,
        maintenanceCalories,
        baseSurplus,
        milestoneStepBoost,
        behindPaceBoost,
        targetCalories,
        targetProtein,
        targetCarbs,
        targetFats,
        portionScale,
        phaseName,
        phaseShort,
        phaseNumber,
        sortedLogs
      };
    }

    function scaleAmount(baseVal, scale, step = 5) {
      const raw = baseVal * scale;
      if (step === 1) return Math.max(1, Math.round(raw));
      return Math.max(step, Math.round(raw / step) * step);
    }

    function scaleHalfStep(baseVal, scale) {
      const raw = baseVal * scale;
      return Math.max(0.5, Math.round(raw * 2) / 2);
    }

    function buildScaledMeals(m) {
      const s = m.portionScale;
      const wt = m.workoutTime;

      const oatsG = scaleAmount(60, s, 5);
      const milkMl = scaleAmount(250, s, 25);
      const pbTbsp = scaleHalfStep(1.5, s);
      const bananasBreakfast = scaleHalfStep(1.5, s);
      const eggsBreakfast = scaleAmount(2, s, 1);
      const paneerBreakfastG = scaleAmount(90, s, 10);

      const chanaCups = scaleHalfStep(0.75, s);
      const walnutsHalves = scaleAmount(6, s, 1);

      const riceLunchCups = scaleHalfStep(1.25, s);
      const rotisLunch = scaleHalfStep(2.5, s);
      const meatLunchG = scaleAmount(120, s, 10);

      const eggsEvening = scaleAmount(1, s, 1);
      const curdEveningG = scaleAmount(120, s, 10);

      const rotisDinner = scaleHalfStep(2.5, s);
      const riceDinnerCups = scaleHalfStep(1.25, s);
      const meatDinnerG = scaleAmount(120, s, 10);

      const bedMilkMl = scaleAmount(200, s, 25);

      const baseMeals = [
        {
          id: 'meal_pre',
          time: formatOffsetTime(wt, -30),
          title: 'Pre-Workout Fast Fuel',
          nonVegDesc: `1 ripe banana + ${scaleAmount(5, s, 1)} soaked almonds + 300ml water`,
          vegDesc: `1 ripe banana + ${scaleAmount(5, s, 1)} soaked almonds + 300ml water`,
          baseCal: 140, basePro: 2, baseCarb: 28, baseFat: 3,
          tag: 'Quick Glycogen & Energy'
        },
        {
          id: 'meal_1',
          time: formatOffsetTime(wt, 75),
          title: 'Meal 1: Post-Workout Mass Smoothie & Eggs',
          nonVegDesc: `Smoothie (${bananasBreakfast} bananas, ${oatsG}g rolled oats, ${pbTbsp} tbsp peanut butter, ${milkMl}ml milk, 1 tbsp flax/pumpkin seeds) + ${eggsBreakfast} whole boiled eggs`,
          vegDesc: `Smoothie (${bananasBreakfast} bananas, ${oatsG}g rolled oats, ${pbTbsp} tbsp peanut butter, ${milkMl}ml milk, 1 tbsp flax/pumpkin seeds) + ${paneerBreakfastG}g paneer bhurji`,
          baseCal: 780, basePro: 38, baseCarb: 98, baseFat: 26,
          tag: 'Post-Training Protein Synthesis'
        },
        {
          id: 'meal_2',
          time: formatOffsetTime(wt, 270),
          title: 'Mid-Morning Calorie & Crunch Snack',
          nonVegDesc: `${chanaCups} cup roasted chana + ${walnutsHalves} walnut halves + 1 small seasonal fruit`,
          vegDesc: `${chanaCups} cup roasted chana + ${walnutsHalves} walnut halves + 1 small seasonal fruit`,
          baseCal: 300, basePro: 13, baseCarb: 38, baseFat: 11,
          tag: 'Sustained Calorie Surplus'
        },
        {
          id: 'meal_3',
          time: formatOffsetTime(wt, 420),
          title: 'Meal 2: High-Protein Indian Thali Lunch',
          nonVegDesc: `${riceLunchCups} cups cooked rice (or ${rotisLunch} rotis) + ${meatLunchG}g chicken breast curry + 1 bowl thick dal + 1 cup palak/veg sabzi + curd + 1 tsp ghee`,
          vegDesc: `${riceLunchCups} cups cooked rice (or ${rotisLunch} rotis) + ${meatLunchG}g paneer/tofu curry + 1 bowl thick dal + 1 cup palak/veg sabzi + curd + 1 tsp ghee`,
          baseCal: 720, basePro: 36, baseCarb: 88, baseFat: 22,
          tag: 'Peak Daytime Hypertrophy Fuel'
        },
        {
          id: 'meal_4',
          time: formatOffsetTime(wt, 630),
          title: 'Evening Bridge Snack',
          nonVegDesc: `${eggsEvening} whole boiled egg${eggsEvening > 1 ? 's' : ''} + 1 banana or apple + handful of roasted peanuts`,
          vegDesc: `${curdEveningG}g thick curd / Greek yogurt + 1 banana or apple + handful of roasted peanuts`,
          baseCal: 190, basePro: 8, baseCarb: 24, baseFat: 7,
          tag: 'Prevents Afternoon Catabolism'
        },
        {

    // 5. WEEKLY BULKING DIET AGGREGATOR & MONITOR COMPONENT
    // =========================================================================
    function computeWeeklyDietStats(state, m, scaledMeals) {
      const weekDays = getCurrentWeekDates();
      const weeklyCalTarget = m.targetCalories * 7;
      const weeklyProTarget = m.targetProtein * 7;
      const weeklyMaintenance = m.maintenanceCalories * 7;

      let weeklyCalories = 0;
      let weeklyProtein = 0;
      let adherentDays = 0;
      let loggedDays = 0;

      const dailyBreakdown = weekDays.map(d => {
        const dayMap = state.checkedMealsByDate[d.iso] || {};
        let cals = 0;
        let pro = 0;
        let checkedCount = 0;

        scaledMeals.forEach(meal => {
          if (dayMap[meal.id]) {
            cals += meal.calories;
            pro += meal.protein;
            checkedCount++;
          }
        });

        const calPct = m.targetCalories > 0 ? Math.round((cals / m.targetCalories) * 100) : 0;
        const isAdherent = calPct >= 85;
        if (isAdherent) adherentDays++;
        if (cals > 0) loggedDays++;

        weeklyCalories += cals;
        weeklyProtein += pro;

        return {
          ...d,
          calories: cals,
          protein: pro,
          checkedCount,
          calPct,
          isAdherent
        };
      });

      const weeklyCalPct = Math.min(100, Math.round((weeklyCalories / Math.max(1, weeklyCalTarget)) * 100));
      const weeklyProPct = Math.min(100, Math.round((weeklyProtein / Math.max(1, weeklyProTarget)) * 100));
      const adherencePct = Math.round((adherentDays / 7) * 100);
      const netSurplus = weeklyCalories - (loggedDays * m.maintenanceCalories);

      return {
        weekDays: dailyBreakdown,
        weeklyCalories,
        weeklyCalTarget,
        weeklyCalPct,
        weeklyProtein,
        weeklyProTarget,
        weeklyProPct,
        adherentDays,
        adherencePct,
        loggedDays,
        netSurplus,
        weeklyMaintenance
      };
    }

      const [formStartWeight, setFormStartWeight] = useState(String(state.timeline.startWeight));
      const [formTargetGain, setFormTargetGain] = useState(String(state.timeline.targetGain));
      const [formWorkoutTime, setFormWorkoutTime] = useState(state.timeline.workoutTime);

      const toastTimerRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToastMsg(''), 2600);
      };

      // Sync state to localStorage ('smartbulk_v3_state')
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn('localStorage write skipped:', e);
        }
      }, [state]);

      // Apply theme class
      useEffect(() => {
        const rootEl = document.documentElement;
        if (state.theme === 'light') {
          rootEl.classList.remove('dark');
        } else {
          rootEl.classList.add('dark');
        }
      }, [state.theme]);

      // Rest Timer countdown + Web Audio API beep
      useEffect(() => {
        if (!timerRunning) return;
        const interval = setInterval(() => {
          setTimerRemaining(prev => {
            if (prev <= 1) {
              setTimerRunning(false);
              playBeepAlert();
              showToast('Rest complete! Start your next set 💪');
              return timerPreset;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning, timerPreset]);

      const playBeepAlert = () => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          [0, 0.22].forEach((delay, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(idx === 0 ? 780 : 1040, ctx.currentTime + delay);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.18);
          });
        } catch (e) {}
      };

      // Derived adaptive metrics
      const metrics = useMemo(() => computeTimelineMetrics(state), [state]);
      const scaledMeals = useMemo(() => buildScaledMeals(metrics), [metrics]);
      const scaledWorkouts = useMemo(() => buildScaledWorkouts(metrics), [metrics]);
      const scaledGroceries = useMemo(() => buildScaledGroceries(metrics), [metrics]);
      const weeklyStats = useMemo(
        () => computeWeeklyDietStats(state, metrics, scaledMeals),
        [state, metrics, scaledMeals]
      );

      // Handlers: Diet & Weekly Meal Logging
      const toggleMealForSelectedDate = (mealId) => {
        const targetISO = state.selectedDietDate || getTodayISO();
        setState(prev => {
          const dayMap = prev.checkedMealsByDate[targetISO] || {};
          return {
            ...prev,
            checkedMealsByDate: {
              ...prev.checkedMealsByDate,
              [targetISO]: {
                ...dayMap,
                [mealId]: !dayMap[mealId]
              }
            }
          };
        });
      };

      const completeAllMealsSelectedDay = () => {
        const targetISO = state.selectedDietDate || getTodayISO();
        const allChecked = {};
        scaledMeals.forEach(m => { allChecked[m.id] = true; });
        setState(prev => ({
          ...prev,
          checkedMealsByDate: {
            ...prev.checkedMealsByDate,
            [targetISO]: allChecked
          }
        }));
        showToast(`All 7 meals logged for ${formatCompactDate(targetISO)}!`);
      };

      const copyPreviousDayMeals = () => {
        const currentISO = state.selectedDietDate || getTodayISO();
        const prevISO = addDaysISO(currentISO, -1);
        const prevMap = state.checkedMealsByDate[prevISO];
        if (!prevMap || Object.values(prevMap).filter(Boolean).length === 0) {
          showToast(`No logged meals found on ${formatCompactDate(prevISO)}`);
          return;
        }
        setState(prev => ({
          ...prev,
          checkedMealsByDate: {
            ...prev.checkedMealsByDate,
            [currentISO]: { ...prevMap }
          }
        }));
        showToast(`Copied meals from ${formatCompactDate(prevISO)} → ${formatCompactDate(currentISO)}`);
      };

      const resetSelectedDayMeals = () => {
        const targetISO = state.selectedDietDate || getTodayISO();
        setConfirmDialog({
          title: `Reset ${formatCompactDate(targetISO)} Meals?`,
          desc: `Clear all checked meals for ${formatShortDate(targetISO)}?`,
          onConfirm: () => {
            setState(prev => ({
              ...prev,
              checkedMealsByDate: {
                ...prev.checkedMealsByDate,
                [targetISO]: {}
              }
            }));
            setConfirmDialog(null);
            showToast(`Cleared meals for ${formatCompactDate(targetISO)}`);
          }
        });
      };

      // Handlers: Weight Check-Ins
      const openWeightModal = () => {
        setWeightInput(metrics.currentWeight.toFixed(1));
        setWeightDateInput(getTodayISO());
        setWeightNoteInput('');
        setWeightModalOpen(true);
      };

      const saveWeightCheckIn = (e) => {
        e.preventDefault();
        const val = parseFloat(weightInput);
        if (isNaN(val) || val < 35 || val > 180) {
          showToast('Enter a valid body weight (35–180 kg)');
          return;
        }
        const dateVal = weightDateInput || getTodayISO();
        const noteVal = weightNoteInput.trim() || 'Morning fasted check-in';

        setState(prev => {
          const filtered = prev.weightLogs.filter(l => l.date !== dateVal);
          const updated = [
            ...filtered,
            { id: `w_${Date.now()}`, date: dateVal, weight: +val.toFixed(1), note: noteVal }
          ].sort((a, b) => a.date.localeCompare(b.date));
          return { ...prev, weightLogs: updated };
        });

        setWeightModalOpen(false);
        showToast(`Logged ${val.toFixed(1)} kg • Calories & portions updated!`);
      };

      // Handlers: Timeline Configuration Form
      const handleTimelineSubmit = (e) => {
        e.preventDefault();
        const sWeight = parseFloat(formStartWeight);
        const tGain = parseFloat(formTargetGain);

        if (!formStartDate || !formEndDate) {
          showToast('Select both Start Date and End Date');
          return;
        }
        if (parseLocalMidnight(formEndDate) <= parseLocalMidnight(formStartDate) + 6 * MS_PER_DAY) {
          showToast('End Date must be at least 7 days after Start Date');
          return;
        }
        if (isNaN(sWeight) || sWeight < 35 || sWeight > 160) {
          showToast('Enter a valid Starting Weight (35–160 kg)');
          return;
        }
        if (isNaN(tGain) || tGain < 2 || tGain > 30) {
          showToast('Enter a valid Target Gain (+2 to +30 kg)');
          return;
        }

        setState(prev => {
          const updatedLogs = prev.weightLogs.length === 1 && prev.weightLogs[0].id === 'w_start'
            ? [{ id: 'w_start', date: formStartDate, weight: +sWeight.toFixed(1), note: 'Day 1 Starting Baseline' }]
            : prev.weightLogs;

          return {
            ...prev,
            timeline: {
              startDate: formStartDate,
              endDate: formEndDate,
              startWeight: +sWeight.toFixed(1),
              targetGain: +tGain.toFixed(1),
              workoutTime: formWorkoutTime || '06:00'
            },
            weightLogs: updatedLogs
          };
        });
        showToast('Timeline updated! Meals, workouts & milestones scaled');
      };

      const applyPresetWeeks = (weeks) => {
        const base = formStartDate || getTodayISO();
        setFormEndDate(addDaysISO(base, weeks * 7));
      };

      // Handlers: Workouts
      const toggleWorkoutSet = (exId, setIdx) => {
        const key = `${exId}_${setIdx}`;
        setState(prev => ({
          ...prev,
          completedSets: {
            ...prev.completedSets,
            [key]: !prev.completedSets[key]
          }
        }));
      };

      const toggleWorkoutDayDone = (dayNum) => {
        const dayPlan = scaledWorkouts.find(d => d.day === dayNum);
        const key = String(dayNum);
        const nextVal = !state.completedWorkoutDays[key];
        setState(prev => {
          const nextSets = { ...prev.completedSets };
          if (dayPlan && nextVal) {
            dayPlan.exercises.forEach(ex => {
              for (let i = 0; i < ex.sets; i++) {
                nextSets[`${ex.id}_${i}`] = true;
              }
            });
          }
          return {
            ...prev,
            completedSets: nextSets,
            completedWorkoutDays: {
              ...prev.completedWorkoutDays,
              [key]: nextVal
            }
          };
        });
        if (nextVal && dayPlan) showToast(`${dayPlan.title} completed! 💪`);
      };

      // Handlers: Groceries
      const toggleGroceryItem = (id) => {
        setState(prev => ({
          ...prev,
          checkedGroceries: {
            ...prev.checkedGroceries,
            [id]: !prev.checkedGroceries[id]
          }
        }));
      };

      const handleAddCustomGrocery = (e) => {
        e.preventDefault();
        const name = customGroceryName.trim();
        if (!name) {
          showToast('Enter an item name first');
          return;
        }
        const qty = customGroceryQty.trim() || '1 pack';
        setState(prev => ({
          ...prev,
          customGroceries: [
            { id: `custom_${Date.now()}`, category: customGroceryCat, name, qty },
            ...prev.customGroceries
          ]
        }));
        setCustomGroceryName('');
        setCustomGroceryQty('');
        showToast(`Added "${name}" to ${customGroceryCat}`);
      };

      // Selected day meal calculations
      const selectedDietISO = state.selectedDietDate || getTodayISO();
      const selectedDayCheckedMap = state.checkedMealsByDate[selectedDietISO] || {};
      const selectedDayMeta = weeklyStats.weekDays.find(d => d.iso === selectedDietISO) || {
        label: '',
        compactDate: formatCompactDate(selectedDietISO)
      };

      let dayCalories = 0, dayProtein = 0, dayCarbs = 0, dayFats = 0;
      scaledMeals.forEach(item => {
        if (selectedDayCheckedMap[item.id]) {
          dayCalories += item.calories;
          dayProtein += item.protein;
          dayCarbs += item.carbs;
          dayFats += item.fats;
        }
      });

      const dayCalPct = Math.min(100, Math.round((dayCalories / Math.max(1, metrics.targetCalories)) * 100));
      const dayProPct = Math.min(100, Math.round((dayProtein / Math.max(1, metrics.targetProtein)) * 100));
      const dayCarbPct = Math.min(100, Math.round((dayCarbs / Math.max(1, metrics.targetCarbs)) * 100));
      const dayFatPct = Math.min(100, Math.round((dayFats / Math.max(1, metrics.targetFats)) * 100));
      const dayCheckedCount = Object.values(selectedDayCheckedMap).filter(Boolean).length;

      const isLight = state.theme === 'light';

      return (
        <div className={`w-full max-w-[480px] min-h-screen flex flex-col relative shadow-2xl border-x ${
          isLight ? 'bg-slate-50 border-slate-200 text-slate-900' : 'bg-[#070b14] border-slate-800/80 text-slate-100'
        }`}>
          {/* STICKY TOP HEADER */}
          <header className={`sticky top-0 z-30 backdrop-blur-md border-b px-4 pt-3.5 pb-3 ${
            isLight ? 'bg-white/95 border-slate-200' : 'bg-[#070b14]/95 border-slate-800/80'
          }`}>
            <div className="flex items-center justify-between gap-2">
              <div className="min-w-0">
                <div className="flex items-center gap-2">
                  <span className="inline-flex items-center justify-center w-7 h-7 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 text-slate-950 font-black text-xs shadow-lg shadow-emerald-500/20 flex-shrink-0">
                    ST
                  </span>
                  <h1 className={`text-base font-extrabold tracking-tight truncate ${isLight ? 'text-slate-900' : 'text-white'}`}>
                    SmartBulk Timeline
                  </h1>
                </div>
                <p className="text-[11px] text-slate-400 mt-0.5 flex items-center gap-1.5 truncate">
                  <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 flex-shrink-0" />
                  <span>
                    {formatCompactDate(metrics.startDate)} → {formatCompactDate(metrics.endDate)} • Day {metrics.currentDayNumber} of {metrics.totalDays}
                  </span>
                </p>
              </div>

              <div className="flex items-center gap-1.5 flex-shrink-0">
                <button
                  type="button"
                  onClick={() => setState(prev => ({ ...prev, theme: prev.theme === 'dark' ? 'light' : 'dark' }))}
                  className={`p-2 rounded-xl border transition ${
                    isLight ? 'bg-slate-100 border-slate-300 text-slate-700' : 'bg-slate-800/90 border-slate-700 text-slate-300'
                  }`}
                  aria-label="Toggle Theme"
                >
                  {isLight ? <Icons.Moon className="w-3.5 h-3.5" /> : <Icons.Sun className="w-3.5 h-3.5" />}
                </button>

                <button
                  type="button"
                  onClick={openWeightModal}
                  className="px-2.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 transition text-slate-950 font-extrabold text-xs shadow-md shadow-emerald-500/20 flex items-center gap-1"
                >
                  <Icons.Plus className="w-3.5 h-3.5" />
                  <span>{metrics.currentWeight.toFixed(1)} kg</span>
                </button>
              </div>
            </div>

            {/* Dual Progress Bar: Weight Gain % vs Timeline Pace */}
            <div className="mt-2.5 space-y-1">
              <div className="flex justify-between text-[10px] font-bold">
                <span className="text-slate-400">{metrics.startWeight.toFixed(1)} kg</span>
                <span className={
                  metrics.paceTone === 'emerald' ? 'text-emerald-400' : metrics.paceTone === 'amber' ? 'text-amber-400' : 'text-sky-400'
                }>
                  {metrics.paceStatus} ({metrics.varianceKg >= 0 ? `+${metrics.varianceKg.toFixed(1)}` : metrics.varianceKg.toFixed(1)} kg)
                </span>
                <span className={isLight ? 'text-slate-700' : 'text-slate-300'}>Goal: {metrics.targetWeight.toFixed(1)} kg</span>
              </div>
              <div className={`w-full h-1.5 rounded-full overflow-hidden ${isLight ? 'bg-slate-200' : 'bg-slate-800'}`}>
                <div
                  className="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-amber-400 rounded-full transition-all duration-500"
                  style={{ width: `${Math.max(2, metrics.weightGainPct)}%` }}
                />
              </div>
            </div>
          </header>

          {/* MAIN SCROLLABLE CONTENT */}
          <main className="flex-1 overflow-y-auto px-4 pt-4 pb-28 space-y-4">
            {/* =============================================================== */}
            {/* TAB 1: TODAY & WEEKLY BULKING DIET                              */}
            {/* =============================================================== */}
            {state.activeTab === 'diet' && (
              <>
                <WeeklyDietMonitorCard
                  m={metrics}
                  weeklyStats={weeklyStats}
                  selectedDateISO={selectedDietISO}
                  onSelectDay={(iso) => setState(prev => ({ ...prev, selectedDietDate: iso }))}
                  showJumpLink={false}
                />

                {/* Mon–Sun Day Selector Pills & Quick Logging Shortcuts */}
                <section className="space-y-2">
                  <div className="flex items-center justify-between px-0.5">
                    <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">
                      Logging Diet For:{' '}
                      <span className="text-emerald-400">
                        {selectedDayMeta.label} {selectedDayMeta.compactDate} {selectedDietISO === getTodayISO() ? '(Today)' : ''}
                      </span>
                    </span>
                    {selectedDietISO !== getTodayISO() && (
                      <button
                        type="button"
                        onClick={() => setState(prev => ({ ...prev, selectedDietDate: getTodayISO() }))}
                        className="text-[11px] font-bold text-sky-400 underline"
                      >
                        Jump to Today
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-7 gap-1">
                    {weeklyStats.weekDays.map(d => {
                      const isSel = d.iso === selectedDietISO;
                      return (
                        <button
                          key={d.iso}
                          type="button"
                          onClick={() => setState(prev => ({ ...prev, selectedDietDate: d.iso }))}
                          className={`py-2 px-1 rounded-2xl border text-center transition active:scale-95 ${
                            isSel
                              ? 'bg-emerald-500 border-emerald-400 text-slate-950 shadow-md shadow-emerald-500/20'
                              : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div className="text-[10px] font-extrabold">{d.label}</div>
                          <div className={`text-[9px] font-semibold mt-0.5 ${isSel ? 'text-slate-900' : 'text-slate-400'}`}>
                            {d.checkedCount}/7
                          </div>
                          <div className={`w-1.5 h-1.5 rounded-full mx-auto mt-1 ${
                            d.isAdherent
                              ? (isSel ? 'bg-slate-950' : 'bg-emerald-400')
                              : d.calories > 0
                              ? (isSel ? 'bg-slate-800' : 'bg-amber-400')
                              : (isSel ? 'bg-slate-950/30' : 'bg-slate-700')
                          }`} />
                        </button>
                      );
                    })}
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={completeAllMealsSelectedDay}
                      className="py-2 px-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/35 text-emerald-300 text-[11px] font-bold transition flex items-center justify-center gap-1.5"
                    >
                      <Icons.Check className="w-3.5 h-3.5" />
                      <span>Complete All 7 Meals</span>
                    </button>
                    <button
                      type="button"
                      onClick={copyPreviousDayMeals}
                      className="py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-[11px] font-bold transition flex items-center justify-center gap-1.5"
                    >
                      <Icons.Copy className="w-3.5 h-3.5" />
                      <span>Copy Previous Day</span>
                    </button>
                  </div>
                </section>

                {/* Selected Day Calorie & Macro Summary Card */}
                <section className="bg-slate-900/95 border border-slate-800 rounded-3xl p-4 shadow-lg space-y-3.5">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">
                          {selectedDayMeta.label} {selectedDayMeta.compactDate} Target
                        </span>
                        <span className="px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 text-[9px] font-extrabold">
                          {metrics.portionScale.toFixed(2)}× portions
                        </span>
                      </div>
                      <div className="flex items-baseline gap-1.5 mt-1">
                        <span className="text-2xl font-extrabold text-white">{dayCalories.toLocaleString()}</span>
                        <span className="text-xs font-semibold text-slate-400">/ {metrics.targetCalories.toLocaleString()} kcal</span>
                      </div>
                      {metrics.behindPaceBoost > 0 && (
                        <p className="text-[10px] text-amber-300 mt-0.5">
                          Includes +{metrics.behindPaceBoost} kcal/day catch-up surplus
                        </p>
                      )}
                    </div>

                    <div className="relative w-14 h-14 flex items-center justify-center flex-shrink-0">
                      <svg className="w-14 h-14 -rotate-90" viewBox="0 0 36 36">
                        <path
                          className="text-slate-800"
                          strokeWidth="3.5"
                          stroke="currentColor"
                          fill="none"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <path
                          className="text-emerald-400 transition-all duration-500"
                          strokeDasharray={`${dayCalPct}, 100`}
                          strokeWidth="3.5"
                          strokeLinecap="round"
                          stroke="currentColor"
                          fill="none"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                      </svg>
                      <span className="absolute text-[11px] font-extrabold text-white">{dayCalPct}%</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div className="bg-slate-950/90 border border-slate-800/80 rounded-2xl p-2.5">
                      <div className="flex justify-between text-[11px] font-bold mb-1">
                        <span className="text-emerald-400">Protein</span>
                        <span className="text-slate-300">{dayProtein}/{metrics.targetProtein}g</span>
                      </div>
                      <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-400 rounded-full transition-all duration-300" style={{ width: `${dayProPct}%` }} />
                      </div>
                    </div>

                    <div className="bg-slate-950/90 border border-slate-800/80 rounded-2xl p-2.5">
                      <div className="flex justify-between text-[11px] font-bold mb-1">
                        <span className="text-amber-400">Carbs</span>
                        <span className="text-slate-300">{dayCarbs}/{metrics.targetCarbs}g</span>
                      </div>
                      <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                        <div className="h-full bg-amber-400 rounded-full transition-all duration-300" style={{ width: `${dayCarbPct}%` }} />
                      </div>
                    </div>

                    <div className="bg-slate-950/90 border border-slate-800/80 rounded-2xl p-2.5">
                      <div className="flex justify-between text-[11px] font-bold mb-1">
                        <span className="text-sky-400">Fats</span>
                        <span className="text-slate-300">{dayFats}/{metrics.targetFats}g</span>
                      </div>
                      <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                        <div className="h-full bg-sky-400 rounded-full transition-all duration-300" style={{ width: `${dayFatPct}%` }} />
                      </div>
                    </div>
                  </div>
                </section>

                {/* Diet Preference Toggle + Day Reset */}
                <div className="flex items-center justify-between gap-2">
                  <div className="inline-flex p-1 rounded-2xl bg-slate-900 border border-slate-800">
                    <button
                      type="button"
                      onClick={() => {
                        setState(prev => ({ ...prev, dietMode: 'nonveg' }));
                        showToast('Switched to Eggs & Chicken portions');
                      }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                        state.dietMode === 'nonveg' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Eggs & Chicken
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setState(prev => ({ ...prev, dietMode: 'veg' }));
                        showToast('Switched to Pure Veg portions');
                      }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                        state.dietMode === 'veg' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Pure Veg
                    </button>
                  </div>

                  <button
                    type="button"
                    onClick={resetSelectedDayMeals}
                    className="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-semibold text-slate-400 hover:text-amber-300 transition"
                  >
                    Reset Day ({dayCheckedCount}/7)
                  </button>
                </div>

                {/* Workout Time Anchor Banner */}
                <div className="flex items-center justify-between px-3.5 py-2.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30">
                  <div className="flex items-center gap-2.5">
                    <span className="px-2 py-1 rounded-lg bg-emerald-500 text-slate-950 text-[11px] font-extrabold">
                      {formatOffsetTime(metrics.workoutTime, 0)}
                    </span>
                    <div>
                      <div className="text-xs font-bold text-emerald-300">Daily Training Session</div>
                      <div className="text-[10px] text-emerald-300/80">{metrics.phaseShort} • Meals timed around workout</div>
                    </div>
                  </div>
                  <button
                    type="button"

            {state.activeTab === 'timeline' && (() => {
              // Dual-Line SVG Trajectory Chart geometry
              const chartW = 320;
              const chartH = 120;
              const padL = 30;
              const padR = 12;
              const padT = 12;
              const padB = 22;
              const plotW = chartW - padL - padR;
              const plotH = chartH - padT - padB;

              const startMs = parseLocalMidnight(metrics.startDate);
              const endMs = Math.max(startMs + 7 * MS_PER_DAY, parseLocalMidnight(metrics.endDate));
              const loggedWeights = metrics.sortedLogs.map(l => Number(l.weight));
              const minY = Math.floor((Math.min(metrics.startWeight, ...loggedWeights) - 1) * 2) / 2;
              const maxY = Math.ceil((Math.max(metrics.targetWeight, ...loggedWeights) + 1) * 2) / 2;
              const spanY = Math.max(2, maxY - minY);

              const mapX = (iso) => {
                const ms = parseLocalMidnight(iso);
                const r = Math.max(0, Math.min(1, (ms - startMs) / (endMs - startMs)));
                return padL + r * plotW;
              };
              const mapY = (w) => {
                const r = (w - minY) / spanY;
                return padT + plotH - r * plotH;
              };

              const actualPolyline = metrics.sortedLogs
                .map(l => `${mapX(l.date).toFixed(1)},${mapY(Number(l.weight)).toFixed(1)}`)
                .join(' ');

                          : metrics.paceTone === 'amber'
                          ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30'

                        {metrics.paceStatus}
                      </span>

                        <div className="text-sm font-extrabold text-sky-300 mt-0.5">{metrics.expectedWeightToday.toFixed(1)} kg</div>
                      </div>
                      <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-2.5">
                        <div className="text-[10px] text-slate-400 font-semibold">Latest Logged</div>
                        <div className="text-sm font-extrabold text-white mt-0.5">{metrics.currentWeight.toFixed(1)} kg</div>
                      </div>
                      <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-2.5">
                        <div className="text-[10px] text-slate-400 font-semibold">Target Rate</div>
                        <div className="text-sm font-extrabold text-emerald-400 mt-0.5">+{metrics.weeklyRateKg.toFixed(2)} kg/wk</div>
                      </div>
                    </div>
                  </section>

                    m={metrics}
                    weeklyStats={weeklyStats}
                    selectedDateISO={selectedDietISO}
                    onSelectDay={(iso) => setState(prev => ({ ...prev, selectedDietDate: iso, activeTab: 'diet' }))}
                    showJumpLink={true}
                    onJumpToDiet={() => setState(prev => ({ ...prev, activeTab: 'diet' }))}
                  />

                  {/* Dual-Line SVG Trajectory Chart */}
                  <section className="bg-slate-900/95 border border-slate-800 rounded-3xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-sm font-extrabold text-white">Start-to-End Weight Trajectory</h3>
                        <p className="text-[11px] text-slate-400">Dashed Ideal Pace vs. Solid Logged Weight</p>
                      </div>
                      <button
                        type="button"
                        onClick={openWeightModal}
                        className="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[11px] font-bold"
                      >
                        + Log Weight
                      </button>
                    </div>

                    <div className="bg-slate-950 border border-slate-800/90 rounded-2xl p-2.5">
                      <svg viewBox={`0 0 ${chartW} ${chartH}`} className="w-full h-36 overflow-visible">
                        {[minY, (minY + maxY) / 2, maxY].map((val, i) => {
                          const y = mapY(val).toFixed(1);
                          return (
                            <g key={i}>
                              <line x1={padL} y1={y} x2={chartW - padR} y2={y} stroke="#1e293b" strokeWidth="1" />
                              <text x={padL - 4} y={Number(y) + 3} textAnchor="end" fill="#64748b" fontSize="8" fontWeight="600">
                                {val.toFixed(0)}k
                              </text>
                            </g>
                          );
                        })}

                        {/* Dashed Ideal Trajectory Line */}
                        <line
                          x1={mapX(metrics.startDate).toFixed(1)}
                          y1={mapY(metrics.startWeight).toFixed(1)}
                          x2={mapX(metrics.endDate).toFixed(1)}
                          y2={mapY(metrics.targetWeight).toFixed(1)}
                          stroke="#38bdf8"
                          strokeWidth="2"
                          strokeDasharray="4 4"
                        />
                        <circle
                          cx={mapX(metrics.endDate).toFixed(1)}
                          cy={mapY(metrics.targetWeight).toFixed(1)}
                          r="3.5"
                          fill="#38bdf8"
                        />

                        {/* Solid Logged Weight Line */}
                        {metrics.sortedLogs.length >= 2 && (
                          <polyline
                            fill="none"
                            stroke="#10b981"
                            strokeWidth="2.5"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            points={actualPolyline}
                          />
                        )}

                        {metrics.sortedLogs.map(l => (
                          <circle
                            key={l.id}
                            cx={mapX(l.date).toFixed(1)}
                            cy={mapY(Number(l.weight)).toFixed(1)}
                            r="4"
                            fill="#fbbf24"
                            stroke="#070b14"
                            strokeWidth="1.5"
                          />
                        ))}

                        <text x={padL} y={chartH - 4} textAnchor="start" fill="#94a3b8" fontSize="8" fontWeight="700">
                          {formatCompactDate(metrics.startDate)}
                        </text>
                        <text x={chartW - padR} y={chartH - 4} textAnchor="end" fill="#94a3b8" fontSize="8" fontWeight="700">
                          {formatCompactDate(metrics.endDate)}
                        </text>
                      </svg>

                      <div className="flex items-center justify-center gap-4 mt-1 pt-1.5 border-t border-slate-800/80 text-[10px] font-semibold">
                        <span className="flex items-center gap-1.5 text-sky-300">
                          <span className="w-3 border-t-2 border-dashed border-sky-400" /> Ideal ({metrics.startWeight}→{metrics.targetWeight} kg)
                        </span>
                        <span className="flex items-center gap-1.5 text-emerald-300">
                          <span className="w-2.5 h-2.5 rounded-full bg-amber-400 border border-emerald-400" /> Logged Weight
                        </span>
                      </div>
                    </div>
                  </section>

                  {/* Configurable Start Date -> End Date Goal Setup Form */}
                  <section className="bg-slate-900/95 border border-slate-800 rounded-3xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">
                          Adaptive Goal Engine
                        </span>
                        <h3 className="text-base font-extrabold text-white mt-0.5">Start-to-End Date Setup</h3>
                      </div>
                      <div className="flex gap-1">
                        {[12, 16, 24].map(wks => (
                          <button
                            key={wks}
                            type="button"
                            onClick={() => applyPresetWeeks(wks)}
                            className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-300"
                          >
                            {wks}w
                          </button>
                        ))}
                      </div>
                    </div>

                    <form onSubmit={handleTimelineSubmit} className="space-y-3">
                      <div className="grid grid-cols-2 gap-2.5">
                        <div>
                          <label className="block text-[11px] font-bold text-slate-300 mb-1">Start Date</label>
                          <input
                            type="date"
                            value={formStartDate}
                            onChange={(e) => setFormStartDate(e.target.value)}
                            required
                            className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-300 mb-1">End Date</label>
                          <input
                            type="date"
                            value={formEndDate}
                            onChange={(e) => setFormEndDate(e.target.value)}
                            required
                            className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="block text-[11px] font-bold text-slate-300 mb-1">Start (kg)</label>
                          <input
                            type="number"
                            step="0.1"
                            min="35"
                            max="160"
                            value={formStartWeight}
                            onChange={(e) => setFormStartWeight(e.target.value)}
                            required
                            className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-300 mb-1">Gain (+kg)</label>
                          <input
                            type="number"
                            step="0.5"
                            min="2"
                            max="30"
                            value={formTargetGain}
                            onChange={(e) => setFormTargetGain(e.target.value)}
                            required
                            className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-300 mb-1">Workout</label>
                          <input
                            type="time"
                            value={formWorkoutTime}
                            onChange={(e) => setFormWorkoutTime(e.target.value)}
                            required
                            className="w-full px-2.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-slate-950 font-extrabold text-xs transition shadow-md shadow-emerald-500/20"
                      >
                        Update Timeline & Recalculate Plan
                      </button>
                    </form>
                  </section>

                  {/* Weight Check-In History */}
                  <section className="bg-slate-900/95 border border-slate-800 rounded-3xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-extrabold text-white">Weight Check-In History</h3>
                      <button type="button" onClick={openWeightModal} className="text-xs font-bold text-emerald-400 hover:underline">
                        + Add Check-In
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-slate-800 text-[10px] font-bold uppercase text-slate-400">
                            <th className="py-2 pr-2">Date</th>
                            <th className="py-2 px-2">Weight</th>
                            <th className="py-2 px-2">Gain</th>
                            <th className="py-2 pl-2 text-right">Pace</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/70 text-xs">
                          {[...metrics.sortedLogs].reverse().map(log => {
                            const w = Number(log.weight);
                            const delta = +(w - metrics.startWeight).toFixed(1);
                            const logMs = parseLocalMidnight(log.date);
                            const logElapsed = Math.max(0, Math.min(metrics.totalDays, Math.round((logMs - startMs) / MS_PER_DAY)));
                            const expAtDate = +(metrics.startWeight + (metrics.targetGain * logElapsed) / metrics.totalDays).toFixed(1);
                            const varAtDate = +(w - expAtDate).toFixed(1);

                            return (
                              <tr key={log.id}>
                                <td className="py-2.5 pr-2 font-medium text-slate-300">
                                  <div>{formatCompactDate(log.date)}</div>
                                  <div className="text-[10px] text-slate-500 truncate max-w-[95px]">{log.note || ''}</div>
                                </td>
                                <td className="py-2.5 px-2 font-extrabold text-white">{w.toFixed(1)} kg</td>
                                <td className={`py-2.5 px-2 font-bold ${delta >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                  {delta >= 0 ? `+${delta.toFixed(1)}` : delta.toFixed(1)} kg
                                </td>
                                <td className={`py-2.5 pl-2 text-right font-bold text-[11px] ${
                                  varAtDate >= 0.2 ? 'text-emerald-400' : varAtDate <= -0.2 ? 'text-amber-400' : 'text-sky-300'
                                }`}>
                                  {varAtDate >= 0.2 ? `+${varAtDate.toFixed(1)} kg ahead` : varAtDate <= -0.2 ? `${varAtDate.toFixed(1)} kg behind` : 'On pace'}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>

                    <div className="pt-2 border-t border-slate-800/80 flex justify-end">
                      <button
                        type="button"
                        onClick={() => setConfirmDialog({
                          title: 'Reset All App Data?',
                          desc: 'Restore default 60.0 kg → 72.0 kg timeline starting today and clear all logs?',
                          onConfirm: () => {
                            const fresh = createDefaultState();
                            setState(fresh);
                            setFormStartDate(fresh.timeline.startDate);
                            setFormEndDate(fresh.timeline.endDate);
                            setFormStartWeight(String(fresh.timeline.startWeight));
                            setFormTargetGain(String(fresh.timeline.targetGain));
                            setFormWorkoutTime(fresh.timeline.workoutTime);
                            setConfirmDialog(null);
                            showToast('App reset to fresh baseline');
                          }
                        })}
                        className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-rose-300 transition"
                      >
                        Reset All Data
                      </button>
                    </div>
                  </section>
                </>
              );
            })()}
          </main>

          {/* TOAST FEEDBACK */}
          {toastMsg && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
              <div className="px-4 py-2 rounded-full bg-slate-900/95 border border-emerald-500/40 text-xs font-semibold text-emerald-300 shadow-xl backdrop-blur-md whitespace-nowrap">
                {toastMsg}
              </div>
            </div>
          )}

          {/* BOTTOM 4-TAB NAVIGATION */}
          <nav className={`fixed bottom-0 w-full max-w-[480px] z-30 backdrop-blur-lg border-t px-2 py-2 ${
            isLight ? 'bg-white/95 border-slate-200' : 'bg-[#0b101d]/95 border-slate-800/90'
          }`}>
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: 'diet', label: 'Today & Diet', Icon: Icons.Clock },
                { id: 'workouts', label: 'Workouts', Icon: Icons.Bolt },
                { id: 'groceries', label: 'Groceries', Icon: Icons.Cart },
                { id: 'timeline', label: 'Timeline', Icon: Icons.Trend }
              ].map(({ id, label, Icon }) => {
                const active = state.activeTab === id;
                return (
                  <button
                    key={id}
                    type="button"
                    onClick={() => setState(prev => ({ ...prev, activeTab: id }))}
                    className={`flex flex-col items-center justify-center py-1.5 rounded-2xl transition active:scale-95 ${
                      active
                        ? 'text-emerald-400 bg-emerald-500/10'
                        : isLight
                        ? 'text-slate-500 hover:text-slate-800'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <Icon className="w-5 h-5 mb-0.5" />
                    <span className="text-[11px] font-semibold">{label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          {/* WEIGHT CHECK-IN MODAL */}
          {weightModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <form
                onSubmit={saveWeightCheckIn}
                className="w-full max-w-sm bg-slate-900 border border-slate-700/80 rounded-3xl p-5 shadow-2xl space-y-4"
              >
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-extrabold text-white">Log Morning Weight</h3>
                    <p className="text-xs text-slate-400">Updates trajectory chart & scales daily calories</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setWeightModalOpen(false)}
                    className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icons.Close className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3">
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Weight (kg)</label>
                      <input
                        type="number"
                        step="0.1"
                        min="35"
                        max="180"
                        value={weightInput}
                        onChange={(e) => setWeightInput(e.target.value)}
                        required
                        className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-950 border border-slate-700 text-white text-base font-bold focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Check-In Date</label>
                      <input
                        type="date"
                        value={weightDateInput}
                        onChange={(e) => setWeightDateInput(e.target.value)}
                        required
                        className="w-full px-3 py-2.5 rounded-2xl bg-slate-950 border border-slate-700 text-white text-xs font-bold focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Note (Optional)</label>
                    <input
                      type="text"
                      value={weightNoteInput}
                      onChange={(e) => setWeightNoteInput(e.target.value)}
                      placeholder="e.g. Fasted morning weigh-in"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setWeightModalOpen(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-extrabold hover:bg-emerald-400 shadow-lg shadow-emerald-500/20"
                  >
                    Save Check-In
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* CUSTOM CONFIRMATION MODAL */}
          {confirmDialog && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-700/80 rounded-3xl p-5 shadow-2xl space-y-4">
                <h3 className="text-base font-extrabold text-white">{confirmDialog.title}</h3>
                <p className="text-xs text-slate-300 leading-relaxed">{confirmDialog.desc}</p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setConfirmDialog(null)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={confirmDialog.onConfirm}
                    className="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold hover:bg-amber-400"
                  >
                    Confirm
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <SmartBulkApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
